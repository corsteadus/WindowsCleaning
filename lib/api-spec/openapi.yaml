components:
  schemas:
    ActiveAssignableUser:
      type: object
      additionalProperties: false
      required: [id, displayName, role, isActive]
      properties:
        id:
          type: string
        displayName:
          type: string
        role:
          type: string
        isActive:
          type: boolean

    ScheduleEstimateInput:
      type: object
      required: [startsAt, durationMinutes, assignedUserId, propertyIds]
      description: startsAt is an ISO 8601 instant selected from an America/Chicago wall time. The server returns its canonical UTC representation.
      properties:
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 15, maximum: 1440 }
        assignedUserId: { type: string, minLength: 1, description: Active canonical Field Tech user ID; team_tech aliases normalize to field_tech. }
        propertyIds: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
        appointmentNotes: { type: string, nullable: true }
        estimateNotes: { type: string, nullable: true }
    EstimateAppointment:
      type: object
      required: [id, quoteId, startsAt, durationMinutes, assignedUserId, propertyIds]
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        assignedUserId: { type: string }
        propertyIds: { type: array, items: { type: integer } }
        appointmentNotes: { type: ["string", "null"] }
        estimateNotes: { type: ["string", "null"] }
    FinalizeEstimateInput:
      type: object
      required: [lineItems]
      properties:
        notes: { type: string, nullable: true }
        terms: { type: string, nullable: true }
        lineItems:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unitPrice]
            properties:
              serviceId: { type: integer, nullable: true }
              description: { type: string, minLength: 1 }
              quantity: { type: number, exclusiveMinimum: 0 }
              unitPrice: { type: number, minimum: 0 }
              propertyId: { type: integer, nullable: true }
              isUpsell: { type: boolean }
              serviceNotes: { type: string, nullable: true }
    DeliverEstimateInput:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [email, sms] }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        expiresInDays: { type: integer, minimum: 1, maximum: 60, default: 30 }
    EstimateDecisionInput:
      type: object
