  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255
    FinancialReconciliationStartDate:
      name: startDate
      in: query
      schema:
        type: string
        format: date
      description: Inclusive company-timezone start date. Defaults to the first day of the current month.
    FinancialReconciliationEndDate:
      name: endDate
      in: query
      schema:
        type: string
        format: date
      description: Inclusive company-timezone end date. Defaults to today.
    FinancialReconciliationMethod:
      name: method
      in: query
      schema:
        type: string
        maxLength: 40
      description: Optional payment/refund method filter.
    FinancialReconciliationSource:
      name: source
      in: query
      schema:
        type: string
        enum: [payment, credit_note]
      description: Optional source-origin filter.
    FinancialReconciliationKind:
      name: kind
      in: query
      schema:
        type: string
        enum: [payment, refund, invoice_credit, customer_credit_application]
      description: Optional transaction-kind filter.
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
