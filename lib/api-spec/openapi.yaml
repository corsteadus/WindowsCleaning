openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Window Cleaning CRM API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: leads
    description: Lead management
  - name: customers
    description: Customer management
  - name: properties
    description: Property/service location management
  - name: services
    description: Service catalog
  - name: quotes
    description: Quote and estimate management
  - name: jobs
    description: Job scheduling and execution
  - name: invoices
    description: Invoicing and payments
  - name: crews
    description: Crew and technician management
  - name: dashboard
    description: Dashboard and reporting
  - name: communication-safety
    description: Consent, suppression, and send-eligibility safety controls
paths:
  /emails/send:
    post:
      tags: [communication-safety]
      operationId: queueEmailCampaign
      summary: Queue a safety-gated email campaign
      description: Creates a campaign from server-resolved customer or lead records. Bulk sends default to marketing classification and are consent-gated by the campaign processor.
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueEmailCampaignBody"
      responses:
        "202":
          description: Campaign queued for asynchronous safety evaluation and delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedEmailCampaignResponse"
        "400":
          description: Invalid campaign or recipient request.
        "401":
          description: Authentication required.
        "403":
          description: Communication sending capability required.
  /emails/send-one:
    post:
      tags: [communication-safety]
      operationId: sendOneEmail
      summary: Send one transactional email
      description: Sends only to the server-resolved customer or lead record. Every request requires Idempotency-Key; quiet-hour deferrals are returned as a non-send response rather than silently queued.
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOneEmailBody"
      responses:
        "200":
          description: Email sent or an idempotent replay was returned.
        "400":
          description: Invalid request or missing Idempotency-Key.
        "401":
          description: Authentication required.
        "403":
          description: Communication sending capability required.
        "409":
          description: Quiet hours are active, or the idempotency key is in progress/conflicting.
        "422":
          description: Recipient is blocked by communication safety policy.
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Log in with a local username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginWithPasswordBody"
      responses:
        "200":
          description: Login succeeded; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "400":
          description: Missing or invalid request body.
        "401":
          description: Invalid username or password.
        "429":
          description: Too many failed attempts; try again later.
  /admin/users:
    get:
      tags: [Auth]
      operationId: listTeamUsers
      summary: List safe team user fields
      responses:
        "200":
          description: Team users without password hashes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamUser"
        "401": { description: Authentication required. }
        "403": { description: Owner or Super Admin access required. }
    post:
      tags: [Auth]
      operationId: createTeamUser
      summary: Create a local team user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamUserBody"
      responses:
        "201":
          description: Team user created without returning the password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamUser"
        "400": { description: Invalid team user data. }
        "401": { description: Authentication required. }
        "403": { description: Owner or Super Admin access required. }
        "409": { description: Username or email already exists. }
  /team-users/active:
    get:
      tags: [Auth]
      operationId: listActiveTeamUsers
      summary: List active team members available for operational assignment
      description: Requires the schedule.manage capability and returns only opaque IDs, display names, canonical roles, and active state. Field technicians cannot use this organization-wide personnel picker.
      responses:
        "200":
          description: Active team users with assignment-picker identity, role, and state fields only.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveAssignableUser"
        "401": { description: Authentication required. }
        "403": { description: schedule.manage capability required. }
  /admin/users/{id}:
    patch:
      tags: [Auth]
      operationId: updateTeamUser
      summary: Change a team user's role or activation state
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamUserBody"
      responses:
        "200":
          description: Updated team user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamUser"
        "400": { description: Invalid or unsafe update. }
        "401": { description: Authentication required. }
        "403": { description: Protected role or insufficient access. }
        "404": { description: Team user not found. }
  /admin/users/{id}/password-reset:
    post:
      tags: [Auth]
      operationId: resetTeamUserPassword
      summary: Set a team user's local password
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetTeamUserPasswordBody"
      responses:
        "200": { description: Password reset and existing sessions revoked. }
        "400": { description: Invalid password. }
        "401": { description: Authentication required. }
        "403": { description: Insufficient access. }
        "404": { description: Team user not found. }
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      responses:
        "302":
          description: Redirect after login.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.

  /contacts:
    get:
      operationId: listContacts
      tags: [customers]
      summary: List contacts (optionally filter by customerId)
      parameters:
        - name: customerId
          in: query
          schema:
            type: integer
        - name: includeArchived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [customers]
      summary: Create a contact for a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreateInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /contacts/{id}:
    patch:
      operationId: updateContact
      tags: [customers]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdateInput"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [customers]
      summary: Archive a contact (recoverable)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Archived

  /contacts/{id}/primary:
    post:
      operationId: setPrimaryContact
      tags: [customers]
      summary: Set a contact as the account primary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Primary contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}/archive:
    post:
      operationId: archiveContact
      tags: [customers]
      summary: Archive a contact without deleting it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Archived contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}/restore:
    post:
      operationId: restoreContact
      tags: [customers]
      summary: Restore an archived contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /recurring-plans:
    get:
      operationId: listRecurringPlans
      tags: [jobs]
      summary: List recurring service plans
      parameters:
        - name: customerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of recurring plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringPlan"
    post:
      operationId: createRecurringPlan
      tags: [jobs]
      summary: Create a recurring service plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringPlanBody"
      responses:
        "201":
          description: Created recurring plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringPlan"
  /recurring-plans/{id}/generate-job:
    post:
      operationId: generateRecurringJob
      tags: [jobs]
      summary: Generate the next job from a recurring plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Generated job and updated next run date
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: "#/components/schemas/Job"
                  newNextRunDate:
                    type: string
                  message:
                    type: string
                required: [job, newNextRunDate, message]
        "400":
          description: Plan is not active or has no nextRunDate
        "404":
          description: Plan not found

  /recurring-plans/{id}:
    get:
      operationId: getRecurringPlan
      tags: [jobs]
      summary: Get a single recurring plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recurring plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringPlan"
        "404":
          description: Not found
    patch:
      operationId: updateRecurringPlan
      tags: [jobs]
      summary: Update a recurring plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringPlanBody"
      responses:
        "200":
          description: Updated recurring plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringPlan"
    delete:
      operationId: deleteRecurringPlan
      tags: [jobs]
      summary: Delete a recurring plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /automations:
    get:
      operationId: listAutomations
      tags: [automations]
      summary: List all automation rules
      responses:
        "200":
          description: List of automation rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationRule"
    post:
      operationId: createAutomation
      tags: [automations]
      summary: Create an automation rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationBody"
      responses:
        "201":
          description: Created automation rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"

  /automations/{id}:
    get:
      operationId: getAutomation
      tags: [automations]
      summary: Get a single automation rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Automation rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "404":
          description: Not found
    patch:
      operationId: updateAutomation
      tags: [automations]
      summary: Update an automation rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationBody"
      responses:
        "200":
          description: Updated automation rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
    delete:
      operationId: deleteAutomation
      tags: [automations]
      summary: Delete an automation rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /automations/run/job-tomorrow:
    post:
      operationId: runJobTomorrow
      tags: [automations]
      summary: Run job-tomorrow reminder check
      responses:
        "200":
          description: Run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunResult"

  /automations/run/invoice-overdue:
    post:
      operationId: runInvoiceOverdue
      tags: [automations]
      summary: Run invoice-overdue reminder check
      responses:
        "200":
          description: Run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunResult"

  /automations/run/recurring-plan-due:
    post:
      operationId: runRecurringPlanDue
      tags: [automations]
      summary: Run recurring-plan-due reminder check
      responses:
        "200":
          description: Run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunResult"

  /automations/run/job-created:
    post:
      operationId: runJobCreated
      tags: [automations]
      summary: Fire job_created automation for a specific job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId]
              properties:
                jobId:
                  type: integer
      responses:
        "200":
          description: Run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunResult"

  /automations/run/job-completed:
    post:
      operationId: runJobCompleted
      tags: [automations]
      summary: Fire job_completed automation for a specific job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId]
              properties:
                jobId:
                  type: integer
      responses:
        "200":
          description: Run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunResult"

  /message-logs:
    get:
      operationId: listMessageLogs
      tags: [automations]
      summary: List message logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of message logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageLog"

  /automation-events:
    get:
      operationId: listAutomationEvents
      tags: [automations]
      summary: List communication automation events
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
        - name: aggregateType
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paged automation event list with status counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationEventListResponse"

  /automation-events/{id}:
    get:
      operationId: getAutomationEvent
      tags: [automations]
      summary: Get an automation event and delivery history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Automation event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationEventDetail"
        "404":
          description: Not found
    post:
      operationId: retryAutomationEvent
      tags: [automations]
      summary: Requeue one failed automation consumer delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationEventRetryBody"
      responses:
        "202":
          description: Delivery queued for retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationEventRetryResponse"
        "400":
          description: Missing delivery or idempotency key
        "403":
          description: Automation event management capability required
        "409":
          description: Delivery is not retryable or idempotency conflict

  /automation-events/{eventId}/deliveries/{deliveryId}/attempts:
    get:
      operationId: listAutomationEventDeliveryAttempts
      tags: [automations]
      summary: List attempts for one automation delivery
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: deliveryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery attempts
          content:
            application/json:
              schema:
                type: object
                required: [delivery, attempts]
                properties:
                  delivery:
                    $ref: "#/components/schemas/AutomationEventDelivery"
                  attempts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AutomationEventAttempt"
        "404":
          description: Not found

  /automation-event-attempts/{id}:
    get:
      operationId: getAutomationEventAttempt
      tags: [automations]
      summary: Get one automation delivery attempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Automation delivery attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationEventAttempt"
        "404":
          description: Not found

  /tasks:
    get:
      operationId: listTasks
      tags: [leads]
      summary: List tasks
      parameters:
        - name: relatedType
          in: query
          schema:
            type: string
        - name: relatedId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [leads]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [leads]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [leads]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # LEADS
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: clientType
          in: query
          schema:
            type: string
        - name: accountType
          in: query
          schema:
            $ref: "#/components/schemas/AccountType"
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadBody"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
