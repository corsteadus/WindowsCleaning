          amountCents,
          requesterId,
          reason,
          policySnapshot,
          expiresAt,
          createdAt,
        ]
      properties:
        id:
          type: integer
        approvalNumber:
          type: string
        actionType:
          $ref: "#/components/schemas/FinancialApprovalAction"
        status:
          type: string
          enum: [pending, expired, rejected, cancelled, executed]
        targetType:
          type: string
        targetId:
          type: ["integer", "null"]
        targetIds:
          type: array
          items:
            type: integer
        canonicalPayload:
          type: object
          additionalProperties: true
        payloadHash:
          type: string
        amountCents:
          type: string
        amount:
          type: string
        requesterId:
          type: string
        requesterName:
          type: ["string", "null"]
        reason:
          type: string
        policySnapshot:
          type: object
          additionalProperties: true
        expiresAt:
          type: string
          format: date-time
        decidedBy:
          type: ["string", "null"]
        decisionNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: ["string", "null"]
          format: date-time
        executedAt:
          type: ["string", "null"]
          format: date-time
        executionResourceType:
          type: ["string", "null"]
        executionResourceId:
          type: ["integer", "null"]

